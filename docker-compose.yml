# Local development services.
#   docker compose up -d                   -> PostgreSQL only
#   docker compose --profile cache up -d   -> PostgreSQL + Redis (optional, see docs/adr/0006)
name: salary-management

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
      POSTGRES_DB: salary_management
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salary -d salary_management']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ['cache']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
